[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual multiagente do Residencial Aurora com Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.13.0",
    "fastapi>=0.133.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.4",
    "pydantic-settings>=2.7.0,<3.0.0",
]

[project.scripts]
aurora-reset = "aurora.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
